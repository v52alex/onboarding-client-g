openapi: 3.0.3
info:
  title: Onboarding Orchestrator API
  version: 1.0.0
paths:
  /api/v1/onboarding-products:
    get:
      operationId: listOnboardingProducts
      summary: List the products available before an onboarding case is created
      responses:
        '200':
          description: Available product options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnboardingProduct'
  /api/v1/admin/onboarding-products:
    get:
      operationId: listManagedOnboardingProducts
      summary: List all products for catalog administrators
      security: [{keycloak: []}]
      responses:
        '200':
          description: Active and inactive products
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ManagedProduct'}
        '403': {description: The token does not contain the platform-admin role}
    post:
      operationId: createOnboardingProduct
      summary: Create a product in the catalog
      security: [{keycloak: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductRequest'}
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedProduct'}
        '409': {description: Product identifier or code already exists}
  /api/v1/admin/onboarding-products/{id}:
    put:
      operationId: updateOnboardingProduct
      summary: Update a product without changing its identifier
      security: [{keycloak: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductUpdateRequest'}
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedProduct'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/onboarding-products/{id}/status:
    patch:
      operationId: updateOnboardingProductStatus
      summary: Activate or deactivate a product logically
      security: [{keycloak: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties: {active: {type: boolean}}
      responses:
        '200':
          description: Product status updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedProduct'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/onboarding-cases:
    post:
      operationId: startOnboarding
      summary: Start an onboarding case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCaseRequest'
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/onboarding-cases/{caseId}:
    get:
      operationId: getOnboarding
      summary: Get an onboarding case
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Current case state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/onboarding-cases/{caseId}/interaction:
    get:
      operationId: getCurrentInteraction
      summary: Get the current interaction
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Current workflow interaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/onboarding-cases/{caseId}/actions/{action}:
    post:
      operationId: executeInteractionAction
      summary: Execute the action allowed by the current interaction
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: action
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Action is not valid for the current step
  /api/v1/onboarding-cases/{caseId}/events:
    get:
      operationId: listCaseEvents
      summary: List the immutable transition history of a case
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Ordered case events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseEvent'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/onboarding-cases/{caseId}/consents:
    get:
      operationId: listCaseConsents
      summary: List the consent evidence registered for a case
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case consents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consent'
  /api/v1/onboarding-cases/{caseId}/file-sets:
    get:
      operationId: listFileSets
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case file sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileSet'
    post:
      operationId: createFileSet
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileSetRequest'
      responses:
        '201':
          description: File set created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSet'
  /api/v1/onboarding-cases/{caseId}/file-sets/{fileSetId}/documents:
    get:
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/FileSetId'
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
    post:
      operationId: registerDocument
      summary: Register metadata for a binary stored outside the database
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/FileSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDocumentRequest'
      responses:
        '201':
          description: Document metadata registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
  /api/v1/onboarding-cases/{caseId}/file-sets/{fileSetId}/documents/upload:
    post:
      operationId: uploadDocument
      summary: Upload a case document through Content Service
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/FileSetId'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document stored and registered in the onboarding case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/case-management/cases:
    get:
      operationId: searchManagedCases
      summary: Search the operational review queue
      security: [{keycloak: []}]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ReviewStatus'}}
        - {name: assignedTo, in: query, schema: {type: string, maxLength: 150}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Paginated operational queue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedCasePage'}
        '401': {description: Missing or invalid token}
        '403': {description: The token does not contain the case-manager role}
  /api/v1/case-management/cases/{caseId}:
    get:
      operationId: getManagedCase
      security: [{keycloak: []}]
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses:
        '200':
          description: Aggregated case detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedCaseDetail'}
  /api/v1/case-management/cases/{caseId}/assignment:
    post:
      operationId: assignManagedCaseToCurrentOperator
      security: [{keycloak: []}]
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses:
        '200':
          description: Case assigned to the authenticated operator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedCaseDetail'}
        '409': {description: Case is already assigned or decided}
  /api/v1/case-management/cases/{caseId}/decision:
    post:
      operationId: decideManagedCase
      security: [{keycloak: []}]
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [APPROVED, REJECTED]}
                reason: {type: string, maxLength: 500}
      responses:
        '200':
          description: Audited decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedCaseDetail'}
        '409': {description: Invalid assignment or rejection reason}
components:
  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8180/realms/open-onboarding/.well-known/openid-configuration
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileSetId:
      name: fileSetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 150
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 150
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
  schemas:
    StartCaseRequest:
      type: object
      required: [workflowKey]
      properties:
        workflowKey:
          type: string
          example: onboarding
    CaseResponse:
      type: object
      required: [id, workflowKey, currentStep, status, data, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workflowKey:
          type: string
        currentStep:
          type: string
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, DECLINED]
        data:
          type: object
          additionalProperties: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OnboardingProduct:
      type: object
      required: [id, code, name, description]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: string}
    ManagedProduct:
      allOf:
        - {$ref: '#/components/schemas/OnboardingProduct'}
        - type: object
          required: [active, displayOrder]
          properties:
            active: {type: boolean}
            displayOrder: {type: integer, minimum: 0}
    ProductRequest:
      type: object
      required: [id, code, name, description, active, displayOrder]
      properties:
        id: {type: string, pattern: '[a-z0-9-]+'}
        code: {type: string, pattern: '[A-Z0-9_]+'}
        name: {type: string, maxLength: 150}
        description: {type: string, maxLength: 500}
        active: {type: boolean}
        displayOrder: {type: integer, minimum: 0}
    ProductUpdateRequest:
      type: object
      required: [code, name, description, active, displayOrder]
      properties:
        code: {type: string, pattern: '[A-Z0-9_]+'}
        name: {type: string, maxLength: 150}
        description: {type: string, maxLength: 500}
        active: {type: boolean}
        displayOrder: {type: integer, minimum: 0}
    InteractionResponse:
      type: object
      required: [caseId, step, terminal, status, metadata]
      properties:
        caseId:
          type: string
          format: uuid
        step:
          type: string
        action:
          type: string
          nullable: true
          enum:
            - select-products
            - accept-terms
            - submit-personal-data
            - submit-kyc
            - submit-address
            - request-otp
            - verify-contact
            - verify-identity
            - submit-enrollment
            - accept-contract
        terminal:
          type: boolean
        status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    CaseEvent:
      type: object
      required: [id, caseId, sequence, eventType, resultingStep, metadata, occurredAt]
      properties:
        id: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        sequence: {type: integer, format: int64}
        eventType: {type: string}
        action: {type: string, nullable: true}
        previousStep: {type: string, nullable: true}
        resultingStep: {type: string}
        outcome: {type: string, nullable: true}
        actorId: {type: string, nullable: true}
        correlationId: {type: string, nullable: true}
        metadata: {type: string}
        occurredAt: {type: string, format: date-time}
    Consent:
      type: object
      properties:
        id: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        type: {type: string}
        documentVersion: {type: string}
        accepted: {type: boolean}
        actorId: {type: string, nullable: true}
        correlationId: {type: string, nullable: true}
        evidence: {type: string}
        acceptedAt: {type: string, format: date-time}
    CreateFileSetRequest:
      type: object
      required: [name, maxFiles, allowedMediaTypes]
      properties:
        name: {type: string, maxLength: 120}
        maxFiles: {type: integer, minimum: 1}
        allowedMediaTypes:
          type: array
          minItems: 1
          maxItems: 3
          items: {type: string}
    FileSet:
      type: object
      properties:
        id: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        name: {type: string}
        maxFiles: {type: integer}
        allowedMediaTypes: {type: string}
        createdAt: {type: string, format: date-time}
    RegisterDocumentRequest:
      type: object
      required: [objectKey, originalFileName, mimeType, sizeBytes, checksumSha256]
      properties:
        objectKey: {type: string, maxLength: 500}
        originalFileName: {type: string, maxLength: 255}
        mimeType: {type: string, maxLength: 150}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        checksumSha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
    Document:
      type: object
      properties:
        id: {type: string, format: uuid}
        fileSetId: {type: string, format: uuid}
        objectKey: {type: string}
        originalFileName: {type: string}
        mimeType: {type: string}
        sizeBytes: {type: integer, format: int64}
        checksumSha256: {type: string}
        status: {type: string, enum: [AVAILABLE]}
        createdAt: {type: string, format: date-time}
    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    CaseReview:
      type: object
      required: [caseId, status, createdAt, updatedAt]
      properties:
        caseId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ReviewStatus'}
        assignedTo: {type: string, nullable: true}
        decisionReason: {type: string, nullable: true}
        decidedBy: {type: string, nullable: true}
        decidedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ManagedCaseSummary:
      type: object
      required: [id, workflowKey, currentStep, onboardingStatus, productIds, reviewStatus, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        workflowKey: {type: string}
        currentStep: {type: string}
        onboardingStatus: {type: string, enum: [COMPLETED]}
        productIds:
          type: array
          items: {type: string}
        reviewStatus: {$ref: '#/components/schemas/ReviewStatus'}
        assignedTo: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ManagedCasePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ManagedCaseSummary'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    ManagedCaseDetail:
      type: object
      required: [onboardingCase, review, onboardingEvents, reviewEvents, fileSets]
      properties:
        onboardingCase: {$ref: '#/components/schemas/CaseResponse'}
        review: {$ref: '#/components/schemas/CaseReview'}
        onboardingEvents: {type: array, items: {$ref: '#/components/schemas/CaseEvent'}}
        reviewEvents: {type: array, items: {type: object, additionalProperties: true}}
        fileSets: {type: array, items: {type: object, additionalProperties: true}}
  responses:
    BadRequest:
      description: Invalid request
    NotFound:
      description: Case not found
