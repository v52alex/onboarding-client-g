spring:
  application:
    name: onboarding-client-g
  datasource:
    url: jdbc:h2:mem:onboarding;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:onboarding}
    password: ${RABBITMQ_PASSWORD:onboarding}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/open-onboarding}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/open-onboarding/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

onboarding:
  integrations:
    biometric:
      provider: ${BIOMETRIC_PROVIDER:none}
    kyc:
      provider: ${KYC_PROVIDER:dummy}
    otp:
      provider: ${OTP_PROVIDER:dummy}
    content:
      base-url: ${CONTENT_SERVICE_URL:http://localhost:8084}
      internal-token: ${CONTENT_INTERNAL_TOKEN:}
  outbox:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:5000}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:20}
